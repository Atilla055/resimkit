[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resimkit"
version = "2.7.0"
description = "High-performance image rendering library with LANCZOS resampling"
requires-python = ">=3.8"
dependencies = ["Pillow>=9.0"]

[project.scripts]
render-image = "resimkit.__main__:main"
